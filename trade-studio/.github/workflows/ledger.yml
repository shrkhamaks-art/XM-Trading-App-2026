name: Ledger integration tests
on:
  push:
    paths: ['ledger/**', 'tests/**', '.github/workflows/ledger.yml']
  pull_request:
    paths: ['ledger/**', 'tests/**', '.github/workflows/ledger.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: ephemeral-ci
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.3.8'
      - run: python -m unittest discover -s tests -v
        env:
          LEDGER_TEST_POSTGRES_DSN: postgresql://ledger_test:ephemeral-ci@localhost:5432/ledger_test
