name: Android sandbox debug build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-reference-ui
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and package debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and generate checksum
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xm-trading-sandbox-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

      - name: Test installation and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.example.tradingdemo/.MainActivity
            sleep 5
            adb logcat -d -t 1500 > app/build/outputs/apk/debug/emulator-logcat.txt
            adb shell pidof com.example.tradingdemo

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xm-trading-android-evidence
          path: android/app/build/outputs/apk/debug/*.txt
          if-no-files-found: warn
