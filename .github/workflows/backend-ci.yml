name: Backend checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xm_test
          POSTGRES_PASSWORD: xm_test_password
          POSTGRES_DB: xm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xm_test -d xm_test" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://xm_test:xm_test_password@localhost:5432/xm_test
      JWT_SECRET: ci_only_nonproduction_secret_12345678901234567890
      OTP_PEPPER: ci_only_nonproduction_pepper_12345678901234567890
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m compileall -q app
      - name: Run full tests with JUnit evidence
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xm-trading-backend-test-results
          path: backend/pytest-results.xml
          if-no-files-found: warn
