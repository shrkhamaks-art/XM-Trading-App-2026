<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a35"><title>Trading Demo</title><link rel="stylesheet" href="styles.css"></head><body><header><b>TRADING PLATFORM · DEMO</b><span>بيئة اختبار فقط</span></header><main><section class="card"><h1>استكمال الحساب التجريبي</h1><p>هذه الواجهة لا تستقبل مستندات هوية ولا تنفذ معاملات مالية.</p><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com"><label>كلمة مرور (12 حرفًا على الأقل)</label><input id="password" type="password"><div class="buttons"><button onclick="registerUser()">إنشاء حساب تجريبي</button><button onclick="requestOtp()">طلب رمز OTP</button></div><label>رمز OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="رمز من 6 أرقام"><button onclick="verifyOtp()">تحقق وتسجيل الدخول</button><pre id="out">الحالة: غير متصل</pre></section></main><script src="app.js"></script></body></html>
